<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — EazyAuto</title>
    <script>
      const path = window.location.pathname.toLowerCase();
      const sectionMap = {
        "/inventory": "#inventory",
        "/finance": "#finance",
        "/sell": "#sell",
        "/about": "#about",
        "/contact": "#contact",
      };
      window.location.replace("/" + (sectionMap[path] || ""));
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">EazyAuto</a>…</p>
  </body>
</html>
